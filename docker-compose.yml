name: workflow-rpc-demo

services:
  simple-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: workflow-rpc-demo:latest
    command: ["./rpc_simple_server_demo"]
    stop_signal: SIGINT
    profiles: ["simple"]

  simple-client:
    image: workflow-rpc-demo:latest
    command: ["./rpc_simple_client_demo"]
    depends_on:
      - simple-server
    # The demo client hard-codes 127.0.0.1, so share server network namespace.
    network_mode: "service:simple-server"
    profiles: ["simple"]

  upstream-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: workflow-rpc-demo:latest
    command: ["./rpc_upstream_server_demo"]
    stop_signal: SIGINT
    profiles: ["upstream"]

  upstream-client:
    image: workflow-rpc-demo:latest
    command: ["./rpc_upstream_client_demo"]
    depends_on:
      - upstream-server
    # The demo client hard-codes 127.0.0.1, so share server network namespace.
    network_mode: "service:upstream-server"
    profiles: ["upstream"]

  qps-test:
    build:
      context: .
      dockerfile: Dockerfile
    image: workflow-rpc-demo:latest
    command: ["./rpc_single_client_server_qps_test", "1000"]
    stop_signal: SIGINT
    profiles: ["qps"]
